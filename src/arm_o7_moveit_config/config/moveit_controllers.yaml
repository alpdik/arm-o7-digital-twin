moveit_controller_manager: moveit_simple_controller_manager/MoveItSimpleControllerManager
moveit_manage_controllers: false

moveit_simple_controller_manager:
  controller_names:
    - arm_controller
    - hand_controller

  arm_controller:
    type: FollowJointTrajectory
    action_ns: follow_joint_trajectory
    default: true
    joints:
      - arm_joint_1
      - arm_joint_2
      - arm_joint_3
      - arm_joint_4
      - arm_joint_5
      - arm_joint_6

  hand_controller:
    type: FollowJointTrajectory
    action_ns: follow_joint_trajectory
    default: true
    joints:
      - thumb_cmc_roll
      - thumb_cmc_yaw
      - thumb_cmc_pitch
      - index_mcp_pitch
      - middle_mcp_pitch
      - ring_mcp_pitch
      - pinky_mcp_pitch

trajectory_execution:
  allowed_execution_duration_scaling: 1.20
  allowed_goal_duration_margin: 0.75
  allowed_start_tolerance: 0.03
